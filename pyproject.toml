[project]
name = "mlzoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
deployment = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]
dev = [
    "debugpy>=1.8.22",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"
